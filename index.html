:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#171717;background:#f8f8f8}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer} .app{max-width:490px;margin:auto;min-height:100dvh;background:#fff;padding:20px 19px 100px}.top{display:flex;align-items:center;gap:12px;margin-bottom:23px}.logo{height:49px;width:49px;border:1px solid #ddd;border-radius:16px;display:grid;place-items:center;background:#fafafa;flex-shrink:0}.brand{font-weight:800;font-size:21px;letter-spacing:-.8px}.muted{color:#777;font-size:12px}.date{color:#888;font-size:13px;margin-top:3px}.heading{font-size:25px;letter-spacing:-1px;margin:10px 0 2px}.panel{border:1px solid #e9e9e9;background:#fff;border-radius:19px;padding:18px;margin:15px 0}.soft{background:#f7f7f7;border-color:#f2f2f2}.label{font-size:12px;color:#777}.big{font-size:57px;font-weight:750;letter-spacing:-3px;line-height:1.1}.flex{display:flex;align-items:center;justify-content:space-between;gap:12px}.ring{width:125px;height:125px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#292929 var(--pct),#e9e9e9 0);position:relative;flex-shrink:0}.ring:before{content:'';position:absolute;inset:12px;background:#f7f7f7;border-radius:50%}.ring div{position:relative;text-align:center}.ring strong{font-size:35px;display:block}.ring small{font-size:11px;color:#666}.red{background:#ef3039;color:#fff;border:0;border-radius:13px;padding:16px;width:100%;font-weight:750;margin-top:16px}.red:active{transform:scale(.99)}.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:17px}.stat>div{background:#fff;border:1px solid #eee;border-radius:13px;padding:13px}.stat strong{display:block;font-size:24px;margin-top:5px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:490px;width:100%;display:flex;background:#fff;border-top:1px solid #eee;padding:9px 3px max(10px,env(safe-area-inset-bottom));z-index:5}.nav button{min-width:0;flex:1;border:0;background:transparent;color:#999;font-size:9px;display:grid;justify-items:center;gap:4px}.nav button.active{color:#171717;font-weight:750}.nav svg{height:21px;width:21px}.section-title{font-size:15px;font-weight:750;margin:20px 0 10px}.entry{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee;padding:10px 0;font-size:13px}.entry:last-child{border:0}.delete{border:0;background:none;color:#999;font-size:19px}.pill{padding:7px 11px;background:#f3f3f3;border:1px solid #eee;border-radius:11px;font-size:12px}.calendar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;text-align:center}.dow{font-size:11px;color:#aaa;padding:8px 0}.day{border:0;aspect-ratio:1;background:#f5f5f5;border-radius:50%;font-size:12px;color:#333}.day.blank{visibility:hidden}.day.selected{outline:2px solid #202020;outline-offset:2px}.day.good{background:#dff3e3}.day.bad{background:#ffe0e1}.day.today{background:#1f1f1f;color:white}.progress{height:8px;background:#eaeaea;border-radius:10px;overflow:hidden;margin-top:12px}.progress>div{height:100%;background:#333;border-radius:10px}.schedule{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid #eee;font-size:13px}.schedule:last-child{border:0}.check{accent-color:#222;width:19px;height:19px}.note{font-size:12px;color:#777;line-height:1.6}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{border:1px solid #eee;border-radius:15px;padding:14px}.tile strong{display:block;font-size:24px;margin:7px 0}.bars{display:flex;align-items:flex-end;gap:5px;height:180px;border-bottom:1px solid #ddd;padding-top:15px}.barwrap{flex:1;height:100%;display:flex;align-items:flex-end;position:relative}.bar{width:100%;background:#383838;border-radius:4px 4px 0 0;min-height:1px}.bar.goal{background:#d5d5d5}.barlabels{display:flex;justify-content:space-between;font-size:10px;color:#aaa;margin-top:8px}.field{width:100%;border:1px solid #ddd;border-radius:11px;padding:12px;margin:8px 0 14px;background:white}.action{background:#171717;color:white;border:0;padding:12px 15px;border-radius:11px}.secondary{border:1px solid #ddd;background:#fff;padding:12px 15px;border-radius:11px}.hidden{display:none}.banner{font-size:12px;background:#f5f5f5;border-radius:12px;padding:12px;margin-top:14px;line-height:1.5}.warning{color:#9b272d}.tiny{font-size:11px;color:#888}h3{font-size:16px;margin:0 0 7px} @media(min-width:700px){body{background:#ededed}.app{box-shadow:0 0 35px #0000000d}}
</style></head><body><main class="app"><header class="top"><div class="logo"><svg viewBox="0 0 64 64" width="43" height="43" aria-label="ATPC, prohibido fumar"><circle cx="32" cy="27" r="23" fill="none" stroke="#e42f36" stroke-width="5"/><path d="M15 26h25v7H15z" fill="#222"/><path d="M40 26h7v7h-7z" fill="#aaa"/><path d="M44 18q-6-5 0-10" fill="none" stroke="#666" stroke-width="2"/><path d="M16 11l32 32" stroke="#e42f36" stroke-width="5"/><text x="32" y="60" text-anchor="middle" font-size="15" font-weight="900" fill="#222">ATPC</text></svg></div><div><div class="brand">Mi Smoke</div><div class="muted">ATPC · A tu punto, cero tabaco</div></div></header><div id="screen"></div></main><nav class="nav" id="nav"></nav><script>
const KEY='mismoke-atpc-v1',initial={logs:[],doses:{},start:'2026-11-09',quit:'2026-11-13',baseline:23};let data;try{data={...initial,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{data={...initial}}let tab='hoy',selected=localDay(),month=selected.slice(0,7);const icons={hoy:'<path d="m3 10 9-7 9 7v10h-6v-6H9v6H3z"/>',calendario:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/>',tratamiento:'<rect x="4" y="9" width="16" height="7" rx="3.5" transform="rotate(-45 12 12)"/><path d="m9 9 6 6"/>',evolucion:'<path d="M4 20V11h3v9M10 20V4h3v16M16 20v-9h3v9"/>',mejoras:'<path d="M12 21s-8-4.5-8-11a4.5 4.5 0 0 1 8-2 4.5 4.5 0 0 1 8 2c0 6.5-8 11-8 11z"/>',ajustes:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>'};function localDay(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function parse(s){return new Date(s+'T12:00:00')}function add(s,n){let d=parse(s);d.setDate(d.getDate()+n);return localDay(d)}function count(s){return data.logs.filter(x=>(x.day||localDay(new Date(x.at)))===s).length}function limit(s){if(s<'2026-09-28')return 23;if(s<='2026-10-04')return 21;if(s<='2026-10-11')return 19;if(s<='2026-10-18')return 17;if(s<='2026-10-25')return 15;if(s<='2026-10-28')return 12;if(s<='2026-11-01')return 10;if(s<='2026-11-04')return 8;if(s<='2026-11-08')return 6;if(s==='2026-11-09')return 5;if(s==='2026-11-10')return 4;if(s==='2026-11-11')return 3;if(s==='2026-11-12')return 2;return 0}function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}function fmt(s,opts={day:'numeric',month:'long'}){return parse(s).toLocaleDateString('es-ES',opts)}function days(a,b){return Math.round((parse(b)-parse(a))/86400000)}function todayScreen(){let s=localDay(),n=count(s),max=limit(s),pct=max?Math.min(100,n/max*100):n?100:0,entries=data.logs.filter(x=>(x.day||localDay(new Date(x.at)))===s).sort((a,b)=>b.at.localeCompare(a.at));return `<h1 class="heading">Hoy</h1><div class="date">${fmt(s,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div><div class="panel soft"><div class="flex"><div><div class="label">Objetivo de hoy</div><div class="big">${max}</div><div class="muted">cigarrillos máximo</div></div><div class="ring" style="--pct:${pct}%"><div><strong>${n}</strong><small>fumados</small></div></div></div><div class="stat"><div><div class="label">Disponibles</div><strong>${Math.max(0,max-n)}</strong></div><div><div class="label">Objetivo utilizado</div><strong>${max?Math.round(n/max*100)+'%':n?'Superado':'0%'}</strong></div></div><button class="red" onclick="smoke()">＋ He fumado un cigarrillo</button><div class="tiny" style="margin-top:12px;text-align:center">${n>max?'Has superado el objetivo; mañana seguimos con el plan.':max===0?'Objetivo: cero tabaco. Registra cualquier consumo sin ocultarlo.':'No necesitas fumar los cigarrillos que quedan.'}</div></div><div class="panel"><h3>Próximas fechas</h3><div class="entry"><span>Inicio de Todacitan</span><strong>9 nov</strong></div><div class="entry"><span>Abandono completo, como muy tarde</span><strong>13 nov</strong></div><div class="entry"><span>Primer día completo sin tabaco</span><strong>14 nov</strong></div></div><div class="panel"><div class="flex"><h3>Registros de hoy</h3><span class="muted">${entries.length} registros</span></div>${entries.length?entries.map(x=>`<div class="entry"><span>🚬 ${new Date(x.at).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}</span><button class="delete" aria-label="Eliminar registro" onclick="del('${x.id}')">×</button></div>`).join(''):'<p class="note">Todavía no has registrado ningún cigarrillo hoy.</p>'}</div>`}function smoke(){data.logs.push({id:String(Date.now())+Math.random().toString(36).slice(2),at:new Date().toISOString().replace('Z','Z'),day:localDay()});save()}function del(id){data.logs=data.logs.filter(x=>x.id!==id);save()}function calendarScreen(){let [y,m]=month.split('-').map(Number),first=new Date(y,m-1,1),offset=(first.getDay()+6)%7,total=new Date(y,m,0).getDate(),cells=Array(offset).fill('<span></span>');for(let i=1;i<=total;i++){let s=`${month}-${String(i).padStart(2,'0')}`,n=count(s),has=data.logs.some(x=>(x.day||localDay(new Date(x.at)))===s),cls=s===localDay()?'today':has?(n<=limit(s)?'good':'bad'):'';cells.push(`<button class="day ${cls} ${selected===s?'selected':''}" onclick="selectDay('${s}')">${i}</button>`)}let n=count(selected),max=limit(selected),entries=data.logs.filter(x=>(x.day||localDay(new Date(x.at)))===selected);return `<h1 class="heading">Calendario</h1><p class="date">Tus objetivos y registros</p><div class="panel"><div class="calendar-head"><button class="pill" onclick="moveMonth(-1)">‹</button><strong>${first.toLocaleDateString('es-ES',{month:'long',year:'numeric'})}</strong><button class="pill" onclick="moveMonth(1)">›</button></div><div class="cal">${['L','M','X','J','V','S','D'].map(d=>`<div class="dow">${d}</div>`).join('')}${cells.join('')}</div><p class="note">● Gris: sin registros · Verde: dentro del objetivo · Rojo: objetivo superado</p></div><div class="panel"><h3>${fmt(selected,{weekday:'long',day:'numeric',month:'long'})}</h3><div class="flex"><span>Objetivo: <b>${max}</b></span><span>Registrados: <b>${n}</b></span></div><div class="progress"><div style="width:${max?Math.min(100,n/max*100):n?100:0}%"></div></div>${entries.length?`<p class="note">${entries.length} cigarrillos registrados.</p>`:'<p class="note">Sin registros. No se considera automáticamente un día sin fumar.</p>'}${selected<localDay()?`<button class="secondary" onclick="addPast('${selected}')">+ Añadir un cigarrillo a este día</button>`:''}</div><div class="panel"><h3>Próximos límites</h3>${[['19–25 oct',15],['26–28 oct',12],['29 oct–1 nov',10],['2–4 nov',8],['5–8 nov',6],['9 nov',5],['10 nov',4],['11 nov',3],['12 nov',2],['13 nov en adelante',0]].map(([a,b])=>`<div class="entry"><span>${a}</span><b>${b}</b></div>`).join('')}</div>`}function addPast(s){let time=prompt('Hora del cigarrillo (HH:MM)','12:00');if(!time||!/^([01]\d|2[0-3]):[0-5]\d$/.test(time))return;data.logs.push({id:String(Date.now())+Math.random(),at:new Date(s+'T'+time+':00').toISOString(),day:s});save()}function selectDay(s){selected=s;render()}function moveMonth(n){let [y,m]=month.split('-').map(Number),d=new Date(y,m-1+n,1);month=localDay(d).slice(0,7);render()}function treatmentDay(s){return days(data.start,s)+1}function doseCount(day){return day<=0||day>25?0:day<=3?6:day<=12?5:day<=16?4:day<=20?3:2}function treatmentScreen(){let s=localDay(),day=treatmentDay(s),num=doseCount(day),done=Object.keys(data.doses).filter(k=>k.startsWith(s+'#')&&data.doses[k]).length;return `<h1 class="heading">Tratamiento</h1><p class="date">Todacitan · citisina 1,5 mg</p><div class="panel soft"><div class="label">${day<1?'Inicio previsto':day>25?'Tratamiento previsto finalizado':'Día de tratamiento'}</div><div style="font-size:30px;font-weight:750;margin:7px 0">${day<1?fmt(data.start,{day:'numeric',month:'long'}):day>25?'25 días completados':day+' / 25'}</div><div class="note">${day<1?`Faltan ${days(s,data.start)} días para empezar.`:day<=25?`${done} de ${num} tomas marcadas hoy.`:'Consulta con tu profesional sanitario cualquier duda.'}</div></div><div class="panel"><h3>Pauta orientativa de 25 días</h3>${[['1–3','6 al día · cada 2 horas'],['4–12','5 al día · cada 2,5 horas'],['13–16','4 al día · cada 3 horas'],['17–20','3 al día · cada 5 horas'],['21–25','1–2 al día · según pauta']].map(([a,b])=>`<div class="entry"><span>Días ${a}</span><strong style="font-size:12px">${b}</strong></div>`).join('')}<div class="banner warning">La pauta y los horarios deben confirmarse con tu médico o farmacéutico. No dupliques dosis olvidadas. El quinto día es el 13 de noviembre: debes haber dejado de fumar como muy tarde ese día.</div></div>${day>=1&&day<=25?`<div class="panel"><h3>Registro de tomas de hoy</h3><p class="note">Marca únicamente las dosis realmente tomadas. No son avisos ni instrucciones para tomar una dosis ahora.</p>${Array.from({length:num},(_,i)=>`<label class="schedule"><span>Toma ${i+1} · 1,5 mg</span><input class="check" type="checkbox" ${data.doses[s+'#'+i]?'checked':''} onchange="dose('${s}#${i}',this.checked)"></label>`).join('')}</div>`:''}<p class="note">En esta versión no hay notificaciones automáticas. Para evitar olvidos, utiliza mientras tanto alarmas del móvil según la pauta confirmada.</p>`}function dose(key,v){data.doses[key]=v;save()}function evolutionScreen(){let today=localDay(),from='2026-09-24',span=Math.max(1,days(from,today)+1),total=data.logs.length,logged=new Set(data.logs.map(x=>(x.day||localDay(new Date(x.at))))).size,seven=Array.from({length:14},(_,i)=>add(today,i-13)),bars=seven.map(s=>{let n=count(s);return `<div class="barwrap" title="${s}: ${n} cigarrillos"><div class="bar" style="height:${Math.min(100,n/23*100)}%"></div></div>`}).join(''),last7=Array.from({length:7},(_,i)=>add(today,-i)),avg=last7.reduce((a,s)=>a+count(s),0)/7,known=last7.filter(s=>data.logs.some(x=>(x.day||localDay(new Date(x.at)))===s)).length,realavg=known?last7.reduce((a,s)=>a+count(s),0)/known:null;return `<h1 class="heading">Evolución</h1><p class="date">De 23 cigarrillos diarios hacia cero</p><div class="grid2" style="margin-top:20px"><div class="tile"><div class="label">Referencia inicial</div><strong>23</strong><span class="muted">cig./día</span></div><div class="tile"><div class="label">Consumo estimado actual</div><strong>15</strong><span class="muted">cig./día (declarado)</span></div><div class="tile"><div class="label">Reducción estimada</div><strong>35 %</strong><span class="muted">respecto a 23</span></div><div class="tile"><div class="label">Días con registros</div><strong>${logged}</strong><span class="muted">en la aplicación</span></div></div><div class="panel"><h3>Últimos 14 días</h3><div class="bars">${bars}</div><div class="barlabels"><span>${fmt(seven[0],{day:'numeric',month:'short'})}</span><span>${fmt(today,{day:'numeric',month:'short'})}</span></div><p class="note">Barras: cigarrillos registrados. Los días vacíos no se interpretan como abstinencia.</p></div><div class="panel"><h3>Resumen</h3><div class="entry"><span>Cigarrillos registrados</span><b>${total}</b></div><div class="entry"><span>Media en días registrados (últimos 7)</span><b>${realavg===null?'Sin datos':realavg.toFixed(1)}</b></div><div class="entry"><span>Días registrados dentro del objetivo</span><b>${[...new Set(data.logs.map(x=>(x.day||localDay(new Date(x.at)))))].filter(s=>count(s)<=limit(s)).length}</b></div><p class="note">Los cigarrillos evitados solo se calcularán cuando existan registros suficientes, para no inventar progreso.</p></div>`}function improvementsScreen(){let now=localDay(),quit='2026-11-14',elapsed=days(quit,now),stages=[
[0,'Primeras 24 horas','La frecuencia cardiaca y la presión arterial pueden empezar a bajar; el monóxido de carbono en sangre disminuye.'],
[2,'Entre 48 y 72 horas','La nicotina se elimina progresivamente y el gusto y el olfato pueden mejorar. Las ganas de fumar pueden ser intensas.'],
[14,'De 2 a 12 semanas','La circulación y la función pulmonar pueden empezar a mejorar.'],
[30,'Entre 1 y 9 meses','La tos y la dificultad para respirar suelen disminuir gradualmente.'],
[365,'Alrededor de 1 año','El riesgo de enfermedad coronaria disminuye notablemente respecto a seguir fumando.'],
[1825,'Alrededor de 5 años','El riesgo de algunos accidentes cerebrovasculares y cánceres disminuye con el tiempo.'],
[3650,'Alrededor de 10 años','El riesgo de morir por cáncer de pulmón es mucho menor que si se continúa fumando.']
];let smokingAfter=data.logs.some(x=>(x.day||localDay(new Date(x.at)))>=quit),countdown=elapsed<0?`Faltan ${-elapsed} días para tu primer día completo sin tabaco.`:`Han pasado ${elapsed} días desde la fecha prevista de abandono.`;return `<h1 class="heading">Mejoras</h1><p class="date">Lo que tu cuerpo puede ir recuperando</p><div class="panel soft"><div class="label">Tu fecha objetivo · 14 de noviembre de 2026</div><div style="font-size:26px;font-weight:750;margin:9px 0">${elapsed<0?'Preparando el cambio':elapsed===0?'Hoy empieza una nueva etapa':elapsed+' días desde el objetivo'}</div><p class="note">${countdown} ${smokingAfter?'Hay consumos registrados después de esa fecha: esta cuenta no confirma abstinencia.':'Para confirmar los días realmente sin fumar necesitamos un registro de abstinencia; no se deduce de días sin datos.'}</p></div><div class="panel"><h3>Tu línea de recuperación</h3><p class="note">Plazos orientativos, no garantías individuales. Algunas mejoras llegan antes y otras tardan más.</p>${stages.map(([d,title,description])=>`<div class="entry" style="align-items:flex-start;gap:13px"><div style="font-size:21px;color:#555">${elapsed>=d&&!smokingAfter?'◉':'○'}</div><div style="flex:1"><strong style="font-size:13px">${title}</strong><p class="note" style="margin:5px 0">${description}</p></div></div>`).join('')}</div><div class="panel"><h3>Un avance que no siempre se ve</h3><p class="note">Es normal tener irritabilidad, alteraciones del sueño o deseos intensos de fumar al principio. No significa que tu cuerpo no esté mejorando. Si aparecen síntomas preocupantes, consulta con un profesional sanitario.</p></div>`}function settingsScreen(){return `<h1 class="heading">Ajustes</h1><p class="date">Tu plan y tus datos</p><div class="panel"><h3>Mi plan</h3><div class="entry"><span>Consumo inicial</span><b>23 cig./día</b></div><div class="entry"><span>Consumo estimado al 19 oct</span><b>15 cig./día</b></div><div class="entry"><span>Inicio Todacitan</span><b>9 nov 2026</b></div><div class="entry"><span>Abandono como muy tarde</span><b>13 nov 2026</b></div><div class="entry"><span>Primer día completo sin tabaco</span><b>14 nov 2026</b></div></div><div class="panel"><h3>Mis datos</h3><p class="note">Se guardan en este navegador, en este dispositivo. No se sincronizan entre teléfonos y pueden perderse si borras los datos del navegador.</p><button class="action" onclick="exportData()">Exportar copia de seguridad</button><div style="margin-top:15px"><label class="secondary" style="display:inline-block;cursor:pointer">Importar copia<input type="file" accept="application/json" style="display:none" onchange="importData(this)"></label></div><div style="margin-top:20px"><button class="secondary warning" onclick="resetData()">Borrar todos los registros</button></div></div><div class="panel"><h3>Mi Smoke 1.2 · ATPC</h3><p class="note">Versión instalable sin notificaciones ni sincronización. No sustituye las indicaciones de un profesional sanitario.</p></div>`}function exportData(){let b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='mi-smoke-copia-'+localDay()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function importData(input){let f=input.files[0];if(!f)return;f.text().then(t=>{try{let d=JSON.parse(t);if(!Array.isArray(d.logs)||typeof d.doses!=='object')throw Error();if(confirm('¿Reemplazar los registros actuales por esta copia?')){data={...initial,...d};save()}}catch{alert('El archivo no es una copia válida de Mi Smoke.')}})}function resetData(){if(confirm('¿Borrar todos los registros de cigarrillos y tomas? Esta acción no se puede deshacer.')){data={...initial,logs:[],doses:{}};save()}}function go(t){tab=t;render();window.scrollTo(0,0)}function render(){document.getElementById('screen').innerHTML=({hoy:todayScreen,calendario:calendarScreen,tratamiento:treatmentScreen,evolucion:evolutionScreen,mejoras:improvementsScreen,ajustes:settingsScreen}[tab])();document.getElementById('nav').innerHTML=Object.entries({hoy:'Hoy',calendario:'Calendario',tratamiento:'Tratamiento',evolucion:'Evolución',mejoras:'Mejoras',ajustes:'Ajustes'}).map(([id,label])=>`<button class="${tab===id?'active':''}" onclick="go('${id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${icons[id]}</svg>${label}</button>`).join('')}render();
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('Sin servicio offline:',err)));}
</script></body></html>
